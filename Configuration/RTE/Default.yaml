# CKEditor 5 preset for mai_theme — imported via `editor.config.importModules`.
# Registered in Page TSConfig: RTE.default.preset = mai_theme_default
imports:
  - { resource: "EXT:rte_ckeditor/Configuration/RTE/Editor/Base.yaml" }
  - { resource: "EXT:rte_ckeditor/Configuration/RTE/Editor/Plugins.yaml" }

editor:
  config:
    toolbar:
      items:
        - heading
        - '|'
        - bold
        - italic
        - link
        - '|'
        - bulletedList
        - numberedList
        - '|'
        - blockQuote
        - insertTable
        - '|'
        - undo
        - redo
        - '|'
        - sourceEditing
    heading:
      options:
        - { model: 'paragraph', title: 'Paragraph' }
        - { model: 'heading2', view: 'h2', title: 'Heading 2' }
        - { model: 'heading3', view: 'h3', title: 'Heading 3' }
        - { model: 'heading4', view: 'h4', title: 'Heading 4' }
    link:
      decorators:
        openInNewTab:
          mode: manual
          label: 'Open in new tab'
          attributes:
            target: '_blank'
            rel: 'noopener noreferrer'

processing:
  allowTags:
    - h2
    - h3
    - h4
    - p
    - a
    - strong
    - em
    - ul
    - ol
    - li
    - blockquote
    - table
    - thead
    - tbody
    - tr
    - td
    - th
