# TYPO3 Form framework setup for mai_theme.
# Registers the theme's custom finisher stub and form template paths.
TYPO3:
  CMS:
    Form:
      prototypes:
        standard:
          finishersDefinition:
            ThemeMail:
              implementationClassName: 'Maispace\\MaiTheme\\Finisher\\ThemeMailFinisher'
              FormEngine:
                label: 'Theme Mail (delegates to mai_mail)'
                elements:
                  subject:
                    label: 'Subject'
                    config:
                      type: input
                  recipient:
                    label: 'Recipient'
                    config:
                      type: input
                  template:
                    label: 'Mail template'
                    config:
                      type: input
          formElementsDefinition:
            Form:
              renderingOptions:
                templateRootPaths:
                  100: 'EXT:mai_theme/Resources/Private/Templates/Form/'
                partialRootPaths:
                  100: 'EXT:mai_theme/Resources/Private/Partials/Form/'
                layoutRootPaths:
                  100: 'EXT:mai_theme/Resources/Private/Layouts/Form/'
