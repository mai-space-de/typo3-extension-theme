<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;}
  body{padding:24px;font-family:var(--font-sans);color:var(--bgm-ink);}
  .stack > * + *{margin-top:16px;}
  .row{display:flex;align-items:baseline;gap:16px;}
  .meta{font-family:var(--font-mono);font-size:11px;color:var(--bgm-ink-3);width:88px;flex:0 0 auto;}
</style></head>
<body>
<div class="stack">
  <div class="row"><div class="meta">900 Black</div><div style="font-weight:900;font-size:28px;color:var(--bgm-teal-900)">Pulheim hilft.</div></div>
  <div class="row"><div class="meta">700 Bold</div><div style="font-weight:700;font-size:28px;color:var(--bgm-teal-800)">Pulheim hilft.</div></div>
  <div class="row"><div class="meta">600 Semi</div><div style="font-weight:600;font-size:28px;">Pulheim hilft.</div></div>
  <div class="row"><div class="meta">500 Medium</div><div style="font-weight:500;font-size:28px;">Pulheim hilft.</div></div>
  <div class="row"><div class="meta">400 Regular</div><div style="font-weight:400;font-size:28px;">Pulheim hilft.</div></div>
</div>
<div style="margin-top:20px;font-size:12px;color:var(--bgm-ink-3);font-family:var(--font-mono);">
  Source Sans 3 · Google Fonts substitution — please confirm
</div>
</body></html>
