<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;}
  body{padding:24px;font-family:var(--font-sans);color:var(--bgm-ink);}
  .row{display:flex;gap:16px;flex-wrap:wrap;}
  .swatch{width:140px;}
  .chip{height:80px;border-radius:4px;border:1px solid rgba(0,0,0,.06);}
  .name{font-weight:700;margin-top:8px;font-size:13px;color:var(--bgm-teal-900);}
  .meta{font-size:12px;color:var(--bgm-ink-3);font-family:var(--font-mono);}
</style></head>
<body>
<div class="row">
  <div class="swatch"><div class="chip" style="background:var(--bgm-gold-900)"></div><div class="name">gold-900</div><div class="meta">#8a7414</div></div>
  <div class="swatch"><div class="chip" style="background:var(--bgm-gold-700)"></div><div class="name">gold-700</div><div class="meta">#b69312</div></div>
  <div class="swatch"><div class="chip" style="background:var(--bgm-gold-600)"></div><div class="name">gold-600</div><div class="meta">#ccb629</div></div>
  <div class="swatch"><div class="chip" style="background:var(--bgm-gold-500)"></div><div class="name">gold-500 · Accent</div><div class="meta">#d8b222</div></div>
  <div class="swatch"><div class="chip" style="background:var(--bgm-gold-300)"></div><div class="name">gold-300</div><div class="meta">#ead687</div></div>
  <div class="swatch"><div class="chip" style="background:var(--bgm-gold-100)"></div><div class="name">gold-100</div><div class="meta">#f5e9b8</div></div>
  <div class="swatch"><div class="chip" style="background:var(--bgm-gold-050)"></div><div class="name">gold-050</div><div class="meta">#fbf6e2</div></div>
</div>
</body></html>
