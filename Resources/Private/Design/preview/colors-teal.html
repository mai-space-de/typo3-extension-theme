<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;}
  body{padding:24px;font-family:var(--font-sans);color:var(--bgm-ink);}
  .row{display:flex;gap:16px;flex-wrap:wrap;}
  .swatch{width:140px;}
  .chip{height:80px;border-radius:4px;border:1px solid rgba(0,0,0,.06);}
  .name{font-weight:700;margin-top:8px;font-size:13px;color:var(--bgm-teal-900);}
  .meta{font-size:12px;color:var(--bgm-ink-3);font-family:var(--font-mono);}
</style></head>
<body>
<div class="row">
  <div class="swatch"><div class="chip" style="background:var(--bgm-teal-900)"></div><div class="name">teal-900</div><div class="meta">#0e3f3f</div></div>
  <div class="swatch"><div class="chip" style="background:var(--bgm-teal-800)"></div><div class="name">teal-800</div><div class="meta">#16575a</div></div>
  <div class="swatch"><div class="chip" style="background:var(--bgm-teal-700)"></div><div class="name">teal-700 · Primary</div><div class="meta">#1f6e6e</div></div>
  <div class="swatch"><div class="chip" style="background:var(--bgm-teal-500)"></div><div class="name">teal-500</div><div class="meta">#3c8a89</div></div>
  <div class="swatch"><div class="chip" style="background:var(--bgm-teal-300)"></div><div class="name">teal-300</div><div class="meta">#9bbbbb</div></div>
  <div class="swatch"><div class="chip" style="background:var(--bgm-teal-100);border:1px solid #ddd"></div><div class="name">teal-100</div><div class="meta">#d8e6e6</div></div>
  <div class="swatch"><div class="chip" style="background:var(--bgm-teal-050);border:1px solid #ddd"></div><div class="name">teal-050</div><div class="meta">#eef4f4</div></div>
</div>
</body></html>
