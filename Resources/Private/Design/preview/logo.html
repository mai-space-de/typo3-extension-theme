<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Card</title>
<style>
  html,body{margin:0;background:#fff;}
  body{padding:24px;font-family:'Source Sans 3',sans-serif;display:flex;gap:32px;align-items:center;justify-content:center;}
  .frame{display:flex;flex-direction:column;align-items:center;gap:10px;}
  img.full{height:200px;width:auto;}
  img.mark{height:120px;width:auto;}
  .lbl{font-size:11px;font-family:ui-monospace,monospace;color:#6b6b6b;}
</style></head>
<body>
<div class="frame"><img class="full" src="../assets/logo-full.png" alt="BGM full logo"><div class="lbl">logo-full · vertical lockup</div></div>
<div class="frame"><img class="mark" src="../assets/logo-mark.png" alt="BGM mark"><div class="lbl">logo-mark · 1:1 favicon</div></div>
<div class="frame" style="background:#1f6e6e;padding:20px;"><img class="mark" src="../assets/logo-mark.png" style="filter:brightness(0) invert(1)" alt=""><div class="lbl" style="color:#9bbbbb">on teal · invert</div></div>
</body></html>
