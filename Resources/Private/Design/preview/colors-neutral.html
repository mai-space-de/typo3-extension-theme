<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;}
  body{padding:24px;font-family:var(--font-sans);color:var(--bgm-ink);}
  .row{display:flex;gap:16px;flex-wrap:wrap;}
  .swatch{width:140px;}
  .chip{height:80px;border-radius:4px;border:1px solid #e6e6e6;}
  .name{font-weight:700;margin-top:8px;font-size:13px;color:var(--bgm-teal-900);}
  .meta{font-size:12px;color:var(--bgm-ink-3);font-family:var(--font-mono);}
</style></head>
<body>
<div class="row">
  <div class="swatch"><div class="chip" style="background:var(--bgm-ink)"></div><div class="name">ink</div><div class="meta">#1a1a1a</div></div>
  <div class="swatch"><div class="chip" style="background:var(--bgm-ink-2)"></div><div class="name">ink-2</div><div class="meta">#3a3a3a</div></div>
  <div class="swatch"><div class="chip" style="background:var(--bgm-ink-3)"></div><div class="name">ink-3 · muted</div><div class="meta">#6b6b6b</div></div>
  <div class="swatch"><div class="chip" style="background:var(--bgm-line)"></div><div class="name">line</div><div class="meta">#d6d6d6</div></div>
  <div class="swatch"><div class="chip" style="background:var(--bgm-line-2)"></div><div class="name">line-2</div><div class="meta">#ebebeb</div></div>
  <div class="swatch"><div class="chip" style="background:var(--bgm-surface)"></div><div class="name">surface</div><div class="meta">#f5f5f5</div></div>
  <div class="swatch"><div class="chip" style="background:var(--bgm-card)"></div><div class="name">card</div><div class="meta">#ffffff</div></div>
</div>
</body></html>
