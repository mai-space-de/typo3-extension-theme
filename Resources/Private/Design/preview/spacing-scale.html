<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;}
  body{padding:24px;font-family:var(--font-sans);color:var(--bgm-ink);}
  .row{display:flex;gap:24px;align-items:flex-end;}
  .item{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .box{background:var(--bgm-teal-700);}
  .lbl{font-family:var(--font-mono);font-size:11px;color:var(--bgm-ink-3);}
</style></head>
<body>
<div class="row">
  <div class="item"><div class="box" style="width:4px;height:4px"></div><div class="lbl">1 · 4px</div></div>
  <div class="item"><div class="box" style="width:8px;height:8px"></div><div class="lbl">2 · 8px</div></div>
  <div class="item"><div class="box" style="width:12px;height:12px"></div><div class="lbl">3 · 12px</div></div>
  <div class="item"><div class="box" style="width:16px;height:16px"></div><div class="lbl">4 · 16px</div></div>
  <div class="item"><div class="box" style="width:24px;height:24px"></div><div class="lbl">5 · 24px</div></div>
  <div class="item"><div class="box" style="width:32px;height:32px"></div><div class="lbl">6 · 32px</div></div>
  <div class="item"><div class="box" style="width:48px;height:48px"></div><div class="lbl">7 · 48px</div></div>
  <div class="item"><div class="box" style="width:64px;height:64px"></div><div class="lbl">8 · 64px</div></div>
</div>
<div style="margin-top:18px;font-size:12px;color:var(--bgm-ink-3)">4-px base unit · scale: 4 · 8 · 12 · 16 · 24 · 32 · 48 · 64 · 96</div>
</body></html>
