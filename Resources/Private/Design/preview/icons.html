<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
  html,body{margin:0;background:#fff;}
  body{padding:24px;font-family:var(--font-sans);color:var(--bgm-ink);}
  .grid{display:grid;grid-template-columns:repeat(8,1fr);gap:16px 8px;text-align:center;}
  .cell i{font-size:30px;color:var(--bgm-teal-700);}
  .cell.alt i{color:var(--bgm-gold-500);}
  .cell .n{font-size:11px;color:var(--bgm-ink-3);font-family:var(--font-mono);margin-top:6px;}
</style></head>
<body>
<div class="grid">
  <div class="cell"><i class="ph-fill ph-map-pin"></i><div class="n">map-pin</div></div>
  <div class="cell alt"><i class="ph-fill ph-hand-heart"></i><div class="n">hand-heart</div></div>
  <div class="cell"><i class="ph-fill ph-user"></i><div class="n">user</div></div>
  <div class="cell alt"><i class="ph-fill ph-user-circle"></i><div class="n">user-circle</div></div>
  <div class="cell"><i class="ph-fill ph-users-three"></i><div class="n">users-three</div></div>
  <div class="cell alt"><i class="ph-fill ph-calendar-blank"></i><div class="n">calendar</div></div>
  <div class="cell"><i class="ph-fill ph-chat-circle"></i><div class="n">chat</div></div>
  <div class="cell alt"><i class="ph-fill ph-book-open"></i><div class="n">book</div></div>
  <div class="cell"><i class="ph-fill ph-house"></i><div class="n">house</div></div>
  <div class="cell alt"><i class="ph-fill ph-globe"></i><div class="n">globe</div></div>
  <div class="cell"><i class="ph-fill ph-envelope-simple"></i><div class="n">envelope</div></div>
  <div class="cell alt"><i class="ph-fill ph-newspaper"></i><div class="n">news</div></div>
  <div class="cell"><i class="ph-fill ph-download-simple"></i><div class="n">download</div></div>
  <div class="cell alt"><i class="ph-fill ph-question"></i><div class="n">faq</div></div>
  <div class="cell"><i class="ph-fill ph-heart"></i><div class="n">heart</div></div>
  <div class="cell alt"><i class="ph-fill ph-flower"></i><div class="n">flower</div></div>
</div>
<div style="margin-top:14px;font-size:12px;color:var(--bgm-ink-3)">Phosphor Icons (fill) · CDN-loaded · substitution pending confirmation</div>
</body></html>
