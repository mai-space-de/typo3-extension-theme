<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;}
  body{padding:28px 32px;font-family:var(--font-sans);color:var(--bgm-ink);}
  .stack > * + *{margin-top:14px;}
  .meta{font-family:var(--font-mono);font-size:11px;color:var(--bgm-ink-3);margin-left:10px;font-weight:400;letter-spacing:0;}
  h1,h2,h3,h4{margin:0;}
</style></head>
<body>
<div class="stack">
  <h1>Willkommen in Pulheim<span class="meta">h1 · 48/1.15 · 700</span></h1>
  <h2>Angebote für Neubürger<span class="meta">h2 · 36/1.3 · 700</span></h2>
  <h3>Bunter Tisch<span class="meta">h3 · 28/1.3 · 700</span></h3>
  <h4>Mehr erfahren<span class="meta">h4 · 22/1.3 · 700</span></h4>
</div>
</body></html>
