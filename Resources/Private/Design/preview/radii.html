<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;}
  body{padding:24px;font-family:var(--font-sans);color:var(--bgm-ink);}
  .row{display:flex;gap:20px;align-items:center;flex-wrap:wrap;}
  .item{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .box{width:84px;height:54px;background:var(--bgm-teal-700);border:2px solid var(--bgm-teal-900);}
  .lbl{font-family:var(--font-mono);font-size:11px;color:var(--bgm-ink-3);}
  .name{font-weight:700;font-size:12px;color:var(--bgm-teal-900);}
</style></head>
<body>
<div class="row">
  <div class="item"><div class="box" style="border-radius:0"></div><div class="name">square</div><div class="lbl">0 · cards</div></div>
  <div class="item"><div class="box" style="border-radius:2px"></div><div class="name">sm</div><div class="lbl">2 · chips</div></div>
  <div class="item"><div class="box" style="border-radius:4px"></div><div class="name">md · default</div><div class="lbl">4 · btn / input</div></div>
  <div class="item"><div class="box" style="border-radius:8px"></div><div class="name">lg</div><div class="lbl">8 · panels</div></div>
  <div class="item"><div class="box" style="border-radius:999px"></div><div class="name">pill</div><div class="lbl">avatars / tags</div></div>
</div>
</body></html>
