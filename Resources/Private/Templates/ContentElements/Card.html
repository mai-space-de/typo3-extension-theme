<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:theme="http://typo3.org/ns/Maispace/MaiTheme/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">
<f:variable name="header" value="{record -> f:render.text(field: 'header')}" />
<f:variable name="bodytext" value="{record -> f:render.text(field: 'bodytext')}" />
<f:variable name="cardClass" value="offer-card"/>
<f:if condition="{data.tx_maitheme_card_accent} == 'gold'">
    <f:variable name="cardClass" value="offer-card offer-card--gold"/>
</f:if>
<article class="{cardClass}"
         data-ce-uid="{data.uid}"
         {f:if(condition: data.tx_maitheme_anchor_id, then: 'id="{data.tx_maitheme_anchor_id}"', else: 'id="c{data.uid}"')}>

    <f:if condition="{data.tx_maitheme_icon}">
        <div class="offer-card__badge" aria-hidden="true">
            <i class="ph-fill ph-{data.tx_maitheme_icon}"
               style="font-size: var(--icon-size-lg); color: {f:if(condition: data.tx_maitheme_card_accent == 'gold', then: 'var(--bgm-teal-700)', else: 'var(--bgm-gold-500)')}"></i>
        </div>
    </f:if>

    <div class="offer-card__body">
        <f:if condition="{header}">
            <theme:atom.heading level="{data.header_layout}" text="{header}" class="offer-card__title"/>
        </f:if>

        <f:if condition="{bodytext}">
            <div class="offer-card__text">{bodytext -> f:format.raw()}</div>
        </f:if>

        <f:if condition="{data.tx_maitheme_link}">
            <f:variable name="buttonClass" value="button"/>
            <f:if condition="{data.tx_maitheme_card_accent} == 'gold'">
                <f:variable name="buttonClass" value="button button-secondary"/>
            </f:if>
            <f:link.typolink parameter="{data.tx_maitheme_link}"
                             class="{buttonClass}">
                {f:if(condition: data.tx_maitheme_link_text, then: data.tx_maitheme_link_text, else: 'Mehr erfahren')}
            </f:link.typolink>
        </f:if>
    </div>

</article>
</html>
