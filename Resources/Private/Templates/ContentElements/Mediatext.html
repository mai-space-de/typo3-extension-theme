<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<div class="mai-mediatext mai-mediatext--{f:if(condition: data.tx_maitheme_media_position, then: data.tx_maitheme_media_position, else: 'right')}"
     data-ce-uid="{data.uid}"
     {f:if(condition: data.tx_maitheme_anchor_id, then: 'id="{data.tx_maitheme_anchor_id}"', else: 'id="c{data.uid}"')}>
    <f:if condition="{assets}">
        <div class="mai-mediatext__media">
            <f:image image="{assets.0}"
                     alt="{assets.0.properties.alternative}"
                     class="mai-mediatext__image"
                     loading="lazy"/>
        </div>
    </f:if>
    <div class="mai-mediatext__content">
        <f:if condition="{data.header}">
            <f:render partial="Atom/Heading" arguments="{level: data.header_layout, text: data.header, class: 'mai-mediatext__title'}"/>
        </f:if>
        <f:if condition="{data.bodytext}">
            <div class="mai-mediatext__body">{data.bodytext -> f:format.html()}</div>
        </f:if>
    </div>
</div>
</html>
