<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:variable name="header" value="{record -> f:render.text(field: 'header')}" />
<f:variable name="subheader" value="{record -> f:render.text(field: 'subheader')}" />
<f:variable name="bodytext" value="{record -> f:render.text(field: 'bodytext')}" />
<div class="mai-mediatext mai-mediatext--{f:if(condition: data.tx_maitheme_media_position, then: data.tx_maitheme_media_position, else: 'right')}"
     data-ce-uid="{data.uid}"
     {f:if(condition: data.tx_maitheme_anchor_id, then: 'id="{data.tx_maitheme_anchor_id}"', else: 'id="c{data.uid}"')}>
    <f:if condition="{images}">
        <div class="mai-mediatext__media">
            <f:image image="{images.0}"
                     alt="{images.0.properties.alternative}"
                     class="mai-mediatext__image"
                     loading="lazy"/>
        </div>
    </f:if>
    <div class="mai-mediatext__content">
        <f:if condition="{header}">
            <f:render partial="Atom/Heading" arguments="{level: data.header_layout, text: header, class: 'mai-mediatext__title'}"/>
        </f:if>
        <f:if condition="{bodytext}">
            <div class="mai-mediatext__body">{bodytext}</div>
        </f:if>
    </div>
</div>
</html>
