<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:variable name="header" value="{record -> f:render.text(field: 'header')}" />
<f:variable name="subheader" value="{record -> f:render.text(field: 'subheader')}" />
<f:variable name="bodytext" value="{record -> f:render.text(field: 'bodytext')}" />
<div class="mai-progressbar mai-progressbar--{f:if(condition: data.tx_maitheme_variant, then: data.tx_maitheme_variant, else: 'default')}"
     data-ce-uid="{data.uid}"
     {f:if(condition: data.tx_maitheme_anchor_id, then: 'id="{data.tx_maitheme_anchor_id}"', else: 'id="c{data.uid}"')}>
    <f:if condition="{header}">
        <p class="mai-progressbar__label">
            {header}
            <span class="mai-progressbar__value">{data.tx_maitheme_value}%</span>
        </p>
    </f:if>
    <div class="mai-progressbar__track" role="progressbar"
         aria-valuenow="{data.tx_maitheme_value}"
         aria-valuemin="0"
         aria-valuemax="100"
         aria-label="{header}">
        <div class="mai-progressbar__fill" style="--progress: {data.tx_maitheme_value}%"></div>
    </div>
</div>
</html>
