<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<section class="mai-form-block"
         data-ce-uid="{data.uid}"
         {f:if(condition: data.tx_maitheme_anchor_id, then: 'id="{data.tx_maitheme_anchor_id}"', else: 'id="c{data.uid}"')}>
    <f:if condition="{data.header}">
        <f:render partial="Atom/Heading" arguments="{level: data.header_layout, text: data.header, class: 'mai-form-block__title'}"/>
    </f:if>
    <f:if condition="{data.bodytext}">
        <div class="mai-form-block__intro">{data.bodytext -> f:format.html()}</div>
    </f:if>
    <div class="mai-form-block__form">
        <f:if condition="{data.bodytext}">
            <div class="mai-form-placeholder">{data.bodytext -> f:format.html()}</div>
        </f:if>
    </div>
</section>
</html>
