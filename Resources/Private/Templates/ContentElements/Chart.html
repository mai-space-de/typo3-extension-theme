<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:variable name="header" value="{record -> f:render.text(field: 'header')}" />
<section class="mai-chart" data-ce-uid="{data.uid}"{f:if(condition: data.tx_maitheme_anchor_id, then: ' id="{data.tx_maitheme_anchor_id}"', else: ' id="c{data.uid}"')}>
    <f:if condition="{header}">
        <f:render partial="Atom/Heading"
                  arguments="{level: data.header_layout, text: header, class: 'mai-chart__title'}"/>
    </f:if>
    <canvas class="mai-chart__canvas"
            data-chart="{data.bodytext -> f:format.htmlspecialchars()}"
            aria-label="{header}">
    </canvas>
</section>
</html>
