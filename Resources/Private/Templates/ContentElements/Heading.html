<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<header class="mai-heading-block" data-ce-uid="{data.uid}"{f:if(condition: data.tx_maitheme_anchor_id, then: ' id="{data.tx_maitheme_anchor_id}"', else: ' id="c{data.uid}"')}>
    <f:render partial="Atom/Heading"
              arguments="{level: data.header_layout, text: data.header, class: 'mai-heading-block__title'}"/>
    <f:if condition="{data.subheader}">
        <p class="mai-heading-block__subheader">{data.subheader}</p>
    </f:if>
</header>
</html>
