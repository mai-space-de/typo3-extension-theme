<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:variable name="header" value="{record -> f:render.text(field: 'header')}" />
<f:variable name="subheader" value="{record -> f:render.text(field: 'subheader')}" />
<section class="mai-heading-block" data-ce-uid="{data.uid}"{f:if(condition: data.tx_maitheme_anchor_id, then: ' id="{data.tx_maitheme_anchor_id}"', else: ' id="c{data.uid}"')}>
    <f:if condition="{subheader}">
        <p class="eyebrow mai-heading-block__eyebrow">{subheader}</p>
    </f:if>
    <f:render partial="Atom/Heading"
              arguments="{level: data.header_layout, text: header, class: 'mai-heading-block__title'}"/>
</section>
</html>
