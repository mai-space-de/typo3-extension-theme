<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:variable name="header" value="{record -> f:render.text(field: 'header')}" />
<f:variable name="subheader" value="{record -> f:render.text(field: 'subheader')}" />
<f:variable name="bodytext" value="{record -> f:render.text(field: 'bodytext')}" />
<header class="mai-heading-block" data-ce-uid="{data.uid}"{f:if(condition: data.tx_maitheme_anchor_id, then: ' id="{data.tx_maitheme_anchor_id}"', else: ' id="c{data.uid}"')}>
    <f:render partial="Atom/Heading"
              arguments="{level: data.header_layout, text: header, class: 'mai-heading-block__title'}"/>
    <f:if condition="{subheader}">
        <p class="mai-heading-block__subheader">{subheader}</p>
    </f:if>
</header>
</html>
