<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<article class="mai-text" data-ce-uid="{data.uid}"{f:if(condition: data.tx_maitheme_anchor_id, then: ' id="{data.tx_maitheme_anchor_id}"', else: ' id="c{data.uid}"')}>
    <f:if condition="{data.header}">
        <f:render partial="Atom/Heading"
                  arguments="{level: data.header_layout, text: data.header, class: 'mai-text__title'}"/>
    </f:if>
    <f:if condition="{data.subheader}">
        <p class="mai-text__subheader">{data.subheader}</p>
    </f:if>
    <f:if condition="{data.bodytext}">
        <div class="mai-text__body"><f:format.nl2br>{data.bodytext}</f:format.nl2br></div>
    </f:if>
</article>
</html>
