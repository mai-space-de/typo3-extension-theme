<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<div class="mai-logo"
     data-ce-uid="{data.uid}"
     {f:if(condition: data.tx_maitheme_anchor_id, then: 'id="{data.tx_maitheme_anchor_id}"', else: 'id="c{data.uid}"')}>
    <f:if condition="{assets}">
        <f:if condition="{data.tx_maitheme_link}">
            <f:then>
                <f:link.typolink parameter="{data.tx_maitheme_link}" class="mai-logo__link">
                    <f:image image="{assets.0}"
                             alt="{assets.0.properties.alternative}"
                             class="mai-logo__img"
                             loading="lazy"/>
                </f:link.typolink>
            </f:then>
            <f:else>
                <f:image image="{assets.0}"
                         alt="{assets.0.properties.alternative}"
                         class="mai-logo__img"
                         loading="lazy"/>
            </f:else>
        </f:if>
    </f:if>
</div>
</html>
