<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<section class="mai-cta mai-cta--{f:if(condition: data.tx_maitheme_variant, then: data.tx_maitheme_variant, else: 'default')}"
         data-ce-uid="{data.uid}"
         {f:if(condition: data.tx_maitheme_anchor_id, then: 'id="{data.tx_maitheme_anchor_id}"', else: 'id="c{data.uid}"')}>
    <div class="mai-cta__inner">
        <f:if condition="{data.header}">
            <f:render partial="Atom/Heading" arguments="{level: data.header_layout, text: data.header, class: 'mai-cta__title'}"/>
        </f:if>
        <f:if condition="{data.subheader}">
            <p class="mai-cta__subtitle">{data.subheader}</p>
        </f:if>
        <f:if condition="{data.bodytext}">
            <div class="mai-cta__body">{data.bodytext -> f:format.html()}</div>
        </f:if>
        <f:if condition="{data.tx_maitheme_link}">
            <div class="mai-cta__actions">
                <f:link.typolink parameter="{data.tx_maitheme_link}" class="button button--primary">
                    {f:if(condition: data.tx_maitheme_link_text, then: data.tx_maitheme_link_text, else: 'Mehr erfahren')}
                </f:link.typolink>
            </div>
        </f:if>
    </div>
</section>
</html>
