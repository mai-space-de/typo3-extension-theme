<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:theme="http://typo3.org/ns/Maispace/MaiTheme/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">
<f:variable name="header" value="{record -> f:render.text(field: 'header')}" />
<f:variable name="subheader" value="{record -> f:render.text(field: 'subheader')}" />
<f:variable name="bodytext" value="{record -> f:render.text(field: 'bodytext')}" />
<section class="mai-cta mai-cta--{f:if(condition: data.tx_maitheme_variant, then: data.tx_maitheme_variant, else: 'default')}"
         data-ce-uid="{data.uid}"
         {f:if(condition: data.tx_maitheme_anchor_id, then: 'id="{data.tx_maitheme_anchor_id}"', else: 'id="c{data.uid}"')}>
    <div class="mai-cta__inner">
        <f:if condition="{header}">
            <theme:atom.heading level="{data.header_layout}" text="{header}" class="mai-cta__title"/>
        </f:if>
        <f:if condition="{subheader}">
            <p class="mai-cta__subtitle">{subheader}</p>
        </f:if>
        <f:if condition="{bodytext}">
            <div class="mai-cta__body">{bodytext -> f:format.raw()}</div>
        </f:if>
        <f:if condition="{data.tx_maitheme_link}">
            <div class="mai-cta__actions">
                <f:link.typolink parameter="{data.tx_maitheme_link}" class="button button--primary">
                    {f:if(condition: data.tx_maitheme_link_text, then: data.tx_maitheme_link_text, else: 'Mehr erfahren')}
                </f:link.typolink>
            </div>
        </f:if>
    </div>
</section>
</html>
