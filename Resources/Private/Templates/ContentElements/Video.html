<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:consent="http://typo3.org/ns/Maispace/MaiConsent/ViewHelper"
      xmlns:theme="http://typo3.org/ns/Maispace/MaiTheme/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">
<f:variable name="header" value="{record -> f:render.text(field: 'header')}" />
<f:variable name="subheader" value="{record -> f:render.text(field: 'subheader')}" />
<section class="mai-video"
         data-ce-uid="{data.uid}"
         {f:if(condition: data.tx_maitheme_anchor_id, then: 'id="{data.tx_maitheme_anchor_id}"', else: 'id="c{data.uid}"')}>
    <f:if condition="{header}">
        <theme:atom.heading level="{data.header_layout}" text="{header}" class="mai-video__title"/>
    </f:if>
    <div class="mai-video__container">
        <f:if condition="{data.tx_maitheme_video_youtube_id}">
            <f:then>
                <consent:gate category="video"
                              placeholder="Dieses Video wird von YouTube geladen. Bitte akzeptieren Sie die Kategorie „Videos“, um das Video anzusehen.">
                    <iframe class="mai-video__frame"
                            src="https://www.youtube-nocookie.com/embed/{data.tx_maitheme_video_youtube_id}"
                            title="{f:if(condition: header, then: header, else: 'YouTube Video')}"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                            allowfullscreen
                            loading="lazy"></iframe>
                </consent:gate>
            </f:then>
            <f:else>
                <f:if condition="{data.tx_maitheme_video_vimeo_id}">
                    <f:then>
                        <consent:gate category="video"
                                      placeholder="Dieses Video wird von Vimeo geladen. Bitte akzeptieren Sie die Kategorie „Videos“, um das Video anzusehen.">
                            <iframe class="mai-video__frame"
                                    src="https://player.vimeo.com/video/{data.tx_maitheme_video_vimeo_id}"
                                    title="{f:if(condition: header, then: header, else: 'Vimeo Video')}"
                                    allow="autoplay; fullscreen; picture-in-picture"
                                    allowfullscreen
                                    loading="lazy"></iframe>
                        </consent:gate>
                    </f:then>
                    <f:else>
                        <f:if condition="{assets}">
                            <video class="mai-video__player"
                                   controls
                                   {f:if(condition: data.tx_maitheme_video_poster, then: 'poster="{data.tx_maitheme_video_poster.0.publicUrl}"')}
                                   preload="metadata">
                                <f:for each="{assets}" as="file">
                                    <source src="{file.publicUrl}" type="{file.mimeType}"/>
                                </f:for>
                                <p>Ihr Browser unterstützt kein HTML5-Video.</p>
                            </video>
                        </f:if>
                    </f:else>
                </f:if>
            </f:else>
        </f:if>
    </div>
</section>
</html>
