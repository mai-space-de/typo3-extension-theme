<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:variable name="header" value="{record -> f:render.text(field: 'header')}" />
<f:variable name="subheader" value="{record -> f:render.text(field: 'subheader')}" />
<f:variable name="bodytext" value="{record -> f:render.text(field: 'bodytext')}" />
<div class="mai-bentocell mai-bentocell--{data.tx_maitheme_bento_variant}"
     data-ce-uid="{data.uid}"
     style="--col-span: {data.tx_maitheme_bento_colspan}; --row-span: {data.tx_maitheme_bento_rowspan};">
    <f:if condition="{header}"><h3>{header}</h3></f:if>
    <f:if condition="{bodytext}">{bodytext}</f:if>
</div>
</html>
