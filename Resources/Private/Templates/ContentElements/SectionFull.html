<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<section class="mai-section mai-section--full" data-ce-uid="{data.uid}"{f:if(condition: data.tx_maitheme_anchor_id, then: ' id="{data.tx_maitheme_anchor_id}"', else: ' id="c{data.uid}"')}>
    <div class="mai-section__inner">
        <div class="mai-section__col">
            <f:for each="{children_250}" as="child">{child.renderedContent -> f:format.raw()}</f:for>
        </div>
    </div>
</section>
</html>
