<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<section class="mai-map"
         data-ce-uid="{data.uid}"
         {f:if(condition: data.tx_maitheme_anchor_id, then: 'id="{data.tx_maitheme_anchor_id}"', else: 'id="c{data.uid}"')}>
    <f:if condition="{data.header}">
        <f:render partial="Atom/Heading" arguments="{level: data.header_layout, text: data.header, class: 'mai-map__title'}"/>
    </f:if>
    <div class="mai-map__container">
        <iframe class="mai-map__frame"
                src="https://www.openstreetmap.org/export/embed.html?bbox={data.tx_maitheme_lng}%2C{data.tx_maitheme_lat}%2C{data.tx_maitheme_lng}%2C{data.tx_maitheme_lat}&amp;layer=mapnik&amp;marker={data.tx_maitheme_lat}%2C{data.tx_maitheme_lng}&amp;zoom={f:if(condition: data.tx_maitheme_zoom, then: data.tx_maitheme_zoom, else: 14)}"
                title="{f:if(condition: data.header, then: data.header, else: 'Karte')}"
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
    <f:if condition="{data.bodytext}">
        <p class="mai-map__description">{data.bodytext}</p>
    </f:if>
</section>
</html>
