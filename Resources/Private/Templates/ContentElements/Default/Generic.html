<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:comment>
    Wrapper for Extbase content-element plugins (PLUGIN_TYPE_CONTENT_ELEMENT).
    TYPO3 configurePlugin() sets templateName = Generic; plugin output is rendered
    via tt_content.{CType}.20 (EXTBASEPLUGIN) or the {content} variable.
</f:comment>
<f:if condition="{content}">
    <f:then>{content -> f:format.raw()}</f:then>
    <f:else>
        <f:cObject typoscriptObjectPath="tt_content.{data.CType}.20" data="{data}" table="tt_content" />
    </f:else>
</f:if>
</html>
