<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<section class="mai-section mai-section--50-50" data-ce-uid="{data.uid}"{f:if(condition: data.tx_maitheme_anchor_id, then: ' id="{data.tx_maitheme_anchor_id}"', else: ' id="c{data.uid}"')}>
    <div class="mai-section__inner">
        <div class="mai-section__col">
            <f:mark.contentArea colPos="200" txContainerParent="{data.uid}">
                <f:for each="{children_200}" as="child">{child.renderedContent -> f:format.raw()}</f:for>
            </f:mark.contentArea>
        </div>
        <div class="mai-section__col">
            <f:mark.contentArea colPos="201" txContainerParent="{data.uid}">
                <f:for each="{children_201}" as="child">{child.renderedContent -> f:format.raw()}</f:for>
            </f:mark.contentArea>
        </div>
    </div>
</section>
</html>
