<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<div class="mai-icon mai-icon--{f:if(condition: data.tx_maitheme_icon_size, then: data.tx_maitheme_icon_size, else: 'md')}"
     data-ce-uid="{data.uid}"
     {f:if(condition: data.tx_maitheme_anchor_id, then: 'id="{data.tx_maitheme_anchor_id}"', else: 'id="c{data.uid}"')}>
    <f:if condition="{data.tx_maitheme_icon_identifier}">
        <span class="mai-icon__glyph" aria-hidden="true"
              data-icon="{data.tx_maitheme_icon_identifier}"></span>
    </f:if>
    <f:if condition="{data.header}">
        <span class="mai-icon__label">{data.header}</span>
    </f:if>
</div>
</html>
