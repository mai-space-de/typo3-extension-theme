<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:mai="http://typo3.org/ns/Maispace/MaiAssets/ViewHelpers"
      data-namespace-typo3-fluid="true">
<f:variable name="header" value="{record -> f:render.text(field: 'header')}" />
<section class="mai-icon mai-icon--{f:if(condition: data.tx_maitheme_icon_size, then: data.tx_maitheme_icon_size, else: 'md')}"
         data-ce-uid="{data.uid}"
         {f:if(condition: data.tx_maitheme_anchor_id, then: 'id="{data.tx_maitheme_anchor_id}"', else: 'id="c{data.uid}"')}>
    <f:if condition="{data.tx_maitheme_icon_identifier}">
        <span class="mai-icon__glyph" aria-hidden="true">
            <mai:svg.icon
                identifier="mai-theme-content-{data.tx_maitheme_icon_identifier}"
                source="EXT:mai_theme/Resources/Public/Icons/Content/{data.tx_maitheme_icon_identifier}.svg"
                class="mai-icon__svg"
                size="1em"
            />
        </span>
    </f:if>
    <f:if condition="{header}">
        <span class="mai-icon__label">{header}</span>
    </f:if>
</section>
</html>
