<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:theme="http://typo3.org/ns/Maispace/MaiTheme/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">
<f:variable name="header" value="{record -> f:render.text(field: 'header')}" />
<f:variable name="subheader" value="{record -> f:render.text(field: 'subheader')}" />
<f:variable name="bodytext" value="{record -> f:render.text(field: 'bodytext')}" />
<article class="mai-profile"
         data-ce-uid="{data.uid}"
         {f:if(condition: data.tx_maitheme_anchor_id, then: 'id="{data.tx_maitheme_anchor_id}"', else: 'id="c{data.uid}"')}>
    <f:if condition="{images}">
        <div class="mai-profile__media">
            <f:image image="{images.0}"
                     alt="{images.0.properties.alternative -> f:if(condition: '{0}', then: '{0}', else: data.header)}"
                     class="mai-profile__avatar"
                     width="160"
                     height="160"
                     loading="lazy"/>
        </div>
    </f:if>
    <div class="mai-profile__content">
        <f:if condition="{header}">
            <theme:atom.heading level="{data.header_layout}" text="{header}" class="mai-profile__name"/>
        </f:if>
        <f:if condition="{subheader}">
            <p class="mai-profile__role">{subheader}</p>
        </f:if>
        <f:if condition="{bodytext}">
            <div class="mai-profile__bio">{bodytext -> f:format.raw()}</div>
        </f:if>
    </div>
</article>
</html>
