<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:maiTurbo="http://typo3.org/ns/Maispace/MaiTurbo/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:comment>
    Search form organism — overrides `EXT:mai_search/Resources/Private/Templates/Search/Form.html`.
    Kept for template parity; the Search plugin default action is `results` (see Results.html).
</f:comment>

<maiTurbo:context.plugin>
    <maiTurbo:frame id="mai-search-results">
        <section class="mai-search" aria-label="{f:translate(key: 'search.label', default: 'Site search')}">
            <f:form action="results" method="get" name="search" class="mai-search__form" role="search">
                <div
                    class="mai-search__field"
                    data-search-suggest="{f:if(condition: '{suggestEnabled}', then: '1')}"
                >
                    <label for="search-query" class="mai-search__label">
                        <f:translate key="search.placeholder" default="Search..."/>
                    </label>
                    <f:form.textfield
                        id="search-query"
                        name="query"
                        value="{query}"
                        placeholder="{f:translate(key: 'search.placeholder', default: 'Search...')}"
                        class="mai-search__input"
                        additionalAttributes="{autocomplete: 'off', type: 'search', 'data-testid': 'search-input', 'data-search-suggest-input': '1'}"
                    />
                    <f:if condition="{suggestEnabled}">
                        <ul class="mai-search__suggest-list" data-search-suggest-list hidden="hidden" role="listbox"></ul>
                    </f:if>
                    <f:form.submit
                        value="{f:translate(key: 'search.submit', default: 'Search')}"
                        class="mai-search__submit"
                        additionalAttributes="{'data-testid': 'search-submit'}"
                    />
                </div>
            </f:form>
        </section>
    </maiTurbo:frame>
</maiTurbo:context.plugin>

</html>
