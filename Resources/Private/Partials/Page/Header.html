{namespace theme=Maispace\MaiTheme\Components}
<!--
    Page/Header partial — maispace/theme
    ──────────────────────────────────────────────────────────────────────────
    Delegates to the Organism/SiteHeader Fluid Component, which provides a
    clearly defined parameter interface for the site header.
    Kept as a partial for backward compatibility: downstream extensions that
    override via partialRootPaths continue to work unchanged.

    Override by registering a higher-priority partialRootPaths entry in
    your project extension's TypoScript.
-->
<theme:organism.siteHeader
    siteName="{settings.site.name}"
    rootPageUid="{settings.rootPageUid}"
    navigationPages="{settings.navigationPages}"
    logoSrc="{settings.site.logoSrc}"
    showActions="{settings.header.showActions}"
/>
