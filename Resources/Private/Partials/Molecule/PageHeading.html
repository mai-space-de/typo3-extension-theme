<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">
<f:comment>
    Page-level H1 from pages.nav_title (fallback: pages.title).
    Injected via page.10.variables.pageHeading (field = nav_title // title).
    Rendered once per page in the main landmark for WCAG 2.1 AA heading structure.
</f:comment>
<f:if condition="{pageHeading}">
    <h1 class="mai-page__title">{pageHeading}</h1>
</f:if>
</html>
