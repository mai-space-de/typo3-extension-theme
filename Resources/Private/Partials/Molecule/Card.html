<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<article class="mai-card">
    <f:if condition="{image}">
        <f:render partial="Atom/Image" arguments="{image: image, alt: title}"/>
    </f:if>
    <f:render partial="Atom/Heading" arguments="{level: 3, text: title}"/>
    <f:if condition="{text}"><p class="mai-card__text">{text -> f:format.raw()}</p></f:if>
    <f:if condition="{href}">
        <f:render partial="Atom/Button" arguments="{href: href, label: 'Mehr erfahren', variant: 'secondary'}"/>
    </f:if>
</article>
</html>
