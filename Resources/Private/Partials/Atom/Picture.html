<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:mai="http://typo3.org/ns/Maispace/MaiAssets/ViewHelpers"
      data-namespace-typo3-fluid="true">
<f:comment>
    Thin wrapper around mai:image.picture for art-direction image rendering.
    Arguments: image (FAL, required), alt, class, elementUid, critical
    Criticality defaults to 'auto' — pass elementUid for auto-detection.
</f:comment>
<mai:image.picture image="{image}"
                   alt="{alt}"
                   class="mai-picture {class}"
                   elementUid="{elementUid}"
                   critical="{f:if(condition: critical, then: critical, else: 'auto')}"/>
</html>
