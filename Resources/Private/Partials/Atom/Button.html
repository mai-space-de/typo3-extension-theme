<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:if condition="{href}">
    <f:then>
        <a href="{href}" class="mai-button mai-button--{variant}">{label}</a>
    </f:then>
    <f:else>
        <button type="{type}" class="mai-button mai-button--{variant}">{label}</button>
    </f:else>
</f:if>
</html>
