<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:comment>
    Accordion organism. Delegates row rendering to Items/AccordionItem
    (which uses <details>/<summary> for progressive enhancement).
    Arguments: items (tx_maitheme_accordion_item records), data (parent tt_content)
</f:comment>
<section class="mai-accordion"
         data-ce-uid="{data.uid}"
         aria-label="{f:if(condition: data.header, then: data.header, else: 'Accordion')}">
    <f:if condition="{data.header}">
        <f:render partial="Atom/Heading" arguments="{level: 2, text: data.header, class: 'mai-accordion__title'}"/>
    </f:if>
    <f:if condition="{items.0}">
        <f:for each="{items}" as="item" iteration="it">
            <f:render partial="Items/AccordionItem"
                      arguments="{item: item, index: it.cycle, parentUid: data.uid}"/>
        </f:for>
    </f:if>
</section>
</html>
