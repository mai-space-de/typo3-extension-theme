<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:comment>
    Slider organism — carousel landmark per WAI-ARIA APG.
    Arguments: items (tx_maitheme_slider_item records, each with `images`
    FAL array processed via FilesProcessor), data (parent tt_content)
</f:comment>
<section class="mai-slider"
         data-ce-uid="{data.uid}"
         role="region"
         aria-roledescription="carousel"
         aria-label="{f:if(condition: data.header, then: data.header, else: 'Carousel')}">
    <f:if condition="{data.header}">
        <f:render partial="Atom/Heading" arguments="{level: 2, text: data.header, class: 'mai-slider__title'}"/>
    </f:if>
    <ul class="mai-slider__track" aria-live="polite">
        <f:for each="{items}" as="item" iteration="it">
            <f:render partial="Items/SliderItem"
                      arguments="{item: item, index: it.cycle, total: it.total, parentUid: data.uid}"/>
        </f:for>
    </ul>
</section>
</html>
