<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:comment>
    Tabs organism — ARIA tablist pattern.
    The tablist renders buttons (tab_title); panels are rendered via
    Items/TabItem. First tab is selected by default.
    Arguments: items (tx_maitheme_tab_item), data (parent tt_content)
</f:comment>
<div class="mai-tabs" data-ce-uid="{data.uid}">
    <div role="tablist"
         class="mai-tabs__list"
         aria-label="{f:if(condition: data.header, then: data.header, else: 'Tabs')}">
        <f:for each="{items}" as="item" iteration="it">
            <button type="button"
                    role="tab"
                    id="tab-{data.uid}-{it.cycle}"
                    aria-controls="tabpanel-{data.uid}-{it.cycle}"
                    aria-selected="{f:if(condition: it.isFirst, then: 'true', else: 'false')}"
                    tabindex="{f:if(condition: it.isFirst, then: '0', else: '-1')}"
                    class="mai-tabs__tab">{item.tab_title}</button>
        </f:for>
    </div>
    <f:for each="{items}" as="item" iteration="it">
        <f:render partial="Items/TabItem"
                  arguments="{item: item, index: it.cycle, parentUid: data.uid, isSelected: it.isFirst}"/>
    </f:for>
</div>
</html>
