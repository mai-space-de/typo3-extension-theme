<!--
    Organism/SiteHeader — maispace/theme
    ──────────────────────────────────────────────────────────────────────────
    Full site header organism: logo link, main navigation, and an optional
    actions slot (e.g. search, CTA, language switcher). Styled via
    06-organisms/_header.scss.

    Parameters:
      siteName       – Site name used as the logo aria-label and fallback text.
      rootPageUid    – UID of the root page; used as the logo href target.
      navigationPages – Array of navigation page items (see Organism/Navigation).
      logoSrc        – Optional image path/identifier for the logo. When absent
                       the site name is rendered as text.
      showActions    – Renders the "actions" slot when true (default false).

    Named slot:
      actions – Content rendered inside .site-header-actions when showActions
                is enabled. Pass it via <fc:content slot="actions">…</fc:content>.

    Usage:
      {namespace theme=Maispace\MaiTheme\Components}
      <theme:organism.siteHeader
          siteName="{settings.site.name}"
          rootPageUid="{settings.rootPageUid}"
          navigationPages="{settings.navigationPages}"
          logoSrc="{settings.site.logoSrc}"
          showActions="{settings.header.showActions}"
      />
-->
{namespace theme=Maispace\MaiTheme\Components}
<fc:component>
    <fc:param name="siteName" type="string" />
    <fc:param name="rootPageUid" type="integer" />
    <fc:param name="navigationPages" type="array" optional="1" default="{}" />
    <fc:param name="logoSrc" type="string" optional="1" default="" />
    <fc:param name="showActions" type="boolean" optional="1" default="0" />

    <fc:renderer>
        <header class="site-header" role="banner">
            <!-- Logo / site name -->
            <a
                class="site-header-logo link-unstyled"
                href="{f:uri.page(pageUid: rootPageUid, absolute: 1)}"
                aria-label="{siteName}"
            >
                <f:if condition="{logoSrc}">
                    <f:then>
                        <mai:image
                            image="{logoSrc}"
                            alt="{siteName}"
                            width="160"
                            height="40"
                            lazyloading="false"
                            preload="true"
                            fetchPriority="high"
                        />
                    </f:then>
                    <f:else>
                        {siteName}
                    </f:else>
                </f:if>
            </a>

            <!-- Main navigation -->
            <nav
                class="navigation navigation-horizontal"
                aria-label="{f:translate(key: 'LLL:EXT:theme/Resources/Private/Language/locallang.xlf:nav.main', default: 'Main navigation')}"
            >
                <theme:organism.navigation pages="{navigationPages}" />
            </nav>

            <!-- Optional header actions (CTA, search, language switcher) -->
            <f:if condition="{showActions}">
                <div class="site-header-actions">
                    <fc:slot name="actions" />
                </div>
            </f:if>
        </header>
    </fc:renderer>
</fc:component>
