<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:mai="http://typo3.org/ns/Maispace/MaiAssets/ViewHelpers"
      xmlns:theme="http://typo3.org/ns/Maispace/MaiTheme/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">
<f:argument name="languages" type="array" optional="{true}" />
<f:argument name="settings" type="array" optional="{true}" />
<mai:asset.css identifier="mai-topbar"
               src="EXT:mai_theme/Resources/Public/Scss/topbar.scss"
               priority="1"/>

<nav class="site-topbar" aria-label="{f:translate(key: 'topbar.label', extensionName: 'mai_theme')}">
    <div class="site-topbar__inner">

        <theme:organism.navigation.languageMenu languages="{languages}" listId="mai-language-menu-list-topbar"/>

        <f:if condition="{settings.pids.search}">
            <f:link.page pageUid="{settings.pids.search}"
                         class="site-topbar__search"
                         additionalAttributes="{'data-testid': 'topbar-search'}">
                <svg xmlns="http://www.w3.org/2000/svg"
                     class="site-topbar__search-icon"
                     aria-hidden="true"
                     focusable="false"
                     width="16" height="16" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="7"/>
                    <path d="M20 20l-3.5-3.5"/>
                </svg>
                {f:translate(key: 'header.search', extensionName: 'mai_theme')}
            </f:link.page>
        </f:if>

        <f:if condition="{settings.pids.frontendLogin}">
            <f:link.page pageUid="{settings.pids.frontendLogin}"
                         class="site-topbar__login"
                         additionalAttributes="{'data-testid': 'topbar-login'}">
                {f:translate(key: 'header.login', extensionName: 'mai_theme')}
            </f:link.page>
        </f:if>

    </div>
</nav>
</html>
