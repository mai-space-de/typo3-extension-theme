<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:theme="http://typo3.org/ns/Maispace/MaiTheme/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">
<f:argument name="menuMain" type="array" optional="{true}" />
<f:argument name="languages" type="array" optional="{true}" />
<f:argument name="settings" type="array" optional="{true}" />
<f:argument name="siteName" type="string" optional="{true}" />
<header class="site-header" role="banner">
    <div class="site-header__inner">

        <f:comment>── Logo / brand ─────────────────────────────────────────────────</f:comment>
        <f:link.page pageUid="{settings.pids.homepage}" class="site-header-logo link-unstyled">
            <f:if condition="{settings.general.site.logo}">
                <f:image src="{settings.general.site.logo}"
                         alt=""
                         class="site-header-logo__img"
                         loading="eager"
                         decoding="async"/>
            </f:if>
            <span class="site-header-logo__name">{siteName}<span class="visually-hidden"> {f:translate(key: 'header.home_link_suffix', extensionName: 'mai_theme')}</span></span>
        </f:link.page>

        <f:comment>── Main navigation — toggle (mobile) + nav landmark (desktop) ──</f:comment>
        <theme:organism.navigation.menubar menuItems="{menuMain}" languages="{languages}" settings="{settings}"/>

    </div>
</header>
</html>
