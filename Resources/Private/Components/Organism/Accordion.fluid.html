<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:mai="http://typo3.org/ns/Maispace/MaiAssets/ViewHelpers"
      xmlns:theme="http://typo3.org/ns/Maispace/MaiTheme/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">
<f:argument name="items" type="array" optional="{false}" />
<f:argument name="data" type="array" optional="{false}" />
<f:argument name="record" type="mixed" optional="{true}" />
<f:if condition="{record}">
    <f:then><f:variable name="header" value="{record -> f:render.text(field: 'header')}" /></f:then>
    <f:else><f:variable name="header" value="{data.header}" /></f:else>
</f:if>
<mai:asset.css identifier="mai-accordion-css"
               src="EXT:mai_theme/Resources/Public/Scss/accordion-widget.scss"
               priority="0"/>
<section class="mai-accordion"
         data-ce-uid="{data.uid}"
         aria-label="{f:if(condition: header, then: header, else: 'Accordion')}">
    <f:if condition="{header}">
        <theme:atom.heading level="{data.header_layout}" text="{header}" class="mai-accordion__title"/>
    </f:if>
    <f:if condition="{items.0}">
        <f:for each="{items}" as="item" iteration="it">
            <theme:items.accordionItem item="{item}" index="{it.cycle}" parentUid="{data.uid}"/>
        </f:for>
    </f:if>
</section>
</html>
