<fc:component>
    <fc:param name="variant" type="string" optional="1" default="light"/>
    <fc:param name="anchor" type="string" optional="1" default=""/>
    <fc:param name="children" type="string" optional="1" default=""/>

    <fc:renderer>
        <section class="mai-section mai-section--{variant}"<f:if condition="{anchor}"> id="{anchor}"</f:if>>
            <div class="mai-section__inner">{children -> f:format.raw()}</div>
        </section>
    </fc:renderer>
</fc:component>
