<!--
    Organism/Navigation — maispace/theme
    ──────────────────────────────────────────────────────────────────────────
    Renders a two-level navigation list from a structured pages array.
    The wrapping <nav> element and its aria-label should be provided by the
    parent context (e.g. the SiteHeader component) to keep this component
    reusable for both main and footer navigation.

    Accessibility:
      - Active pages receive aria-current="page" automatically.
      - Lists use role="list" to restore list semantics stripped by
        list-style: none in some browser/screenreader combinations.

    Parameters:
      pages – Array of navigation items. Each item should have:
                uid      – Page UID for URI generation.
                title    – Link label.
                isActive – Boolean; marks the current page.
                children – Optional array of child items (same structure).

    Usage:
      {namespace theme=Maispace\MaiTheme\Components}
      <theme:organism.navigation pages="{settings.navigationPages}" />
-->
<fc:component>
    <fc:param name="pages" type="array" />

    <fc:renderer>
        <ul class="list-unstyled" role="list">
            <f:for each="{pages}" as="item">
                <li>
                    <a
                        href="{f:uri.page(pageUid: item.uid)}"
                        {f:if(condition: item.isActive, then: 'aria-current="page"')}
                    >
                        {item.title}
                    </a>

                    <f:if condition="{item.children}">
                        <ul class="list-unstyled" role="list">
                            <f:for each="{item.children}" as="child">
                                <li>
                                    <a
                                        href="{f:uri.page(pageUid: child.uid)}"
                                        {f:if(condition: child.isActive, then: 'aria-current="page"')}
                                    >
                                        {child.title}
                                    </a>
                                </li>
                            </f:for>
                        </ul>
                    </f:if>
                </li>
            </f:for>
        </ul>
    </fc:renderer>
</fc:component>
