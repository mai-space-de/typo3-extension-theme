<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:argument name="label" type="string" optional="{true}" />
<button class="mai-menubar-toggle"
        type="button"
        data-testid="menu-toggle"
        aria-expanded="false"
        aria-controls="main-nav"
        aria-label="{f:if(condition: label, then: label, else: '{f:translate(key: \'menubar.mobile_label\', extensionName: \'mai_theme\')}')}">

    <f:comment>── Hamburger / close icon (CSS-driven via aria-expanded) ──────────</f:comment>
    <span class="mai-menubar-toggle__icon" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
    </span>

    <span class="mai-menubar-toggle__label">
        {f:if(condition: label, then: label, else: '{f:translate(key: \'menubar.mobile_label\', extensionName: \'mai_theme\')}')}
    </span>

</button>
</html>
