<!--
    Molecule/Card — maispace/theme
    ──────────────────────────────────────────────────────────────────────────
    A presentational card molecule. Combines an optional media area, a title
    (optionally linked), and a content slot. Styled via 05-molecules/_card.scss.

    Parameters:
      title    – Card heading text (required).
      link     – Optional URL; when set the title becomes a linked heading.
      image    – Optional image path/identifier for the card media area.
      imageAlt – Alt text for the image (defaults to empty string).

    Slot:
      Default slot renders inside the card body as descriptive text.

    Usage:
      {namespace theme=Maispace\MaiTheme\Components}
      <theme:molecule.card title="TYPO3" link="https://typo3.org" image="..." imageAlt="TYPO3 Logo">
          The professional, flexible Content Management System.
      </theme:molecule.card>
-->
<fc:component>
    <fc:param name="title" type="string" />
    <fc:param name="link" type="string" optional="1" default="" />
    <fc:param name="image" type="string" optional="1" default="" />
    <fc:param name="imageAlt" type="string" optional="1" default="" />

    <fc:renderer>
        <article class="card">
            <f:if condition="{image}">
                <div class="card__media">
                    <mai:image
                        image="{image}"
                        alt="{imageAlt}"
                        width="400"
                        height="225"
                    />
                </div>
            </f:if>

            <div class="card__body">
                <h3 class="card__title">
                    <f:if condition="{link}">
                        <f:then><a href="{link}" class="link-unstyled">{title}</a></f:then>
                        <f:else>{title}</f:else>
                    </f:if>
                </h3>

                <f:if condition="{content}">
                    <div class="card__content">
                        <fc:slot />
                    </div>
                </f:if>
            </div>
        </article>
    </fc:renderer>
</fc:component>
