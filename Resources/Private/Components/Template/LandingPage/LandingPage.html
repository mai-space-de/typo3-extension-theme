<fc:component>
    <fc:param name="hero" type="string" optional="1" default=""/>
    <fc:param name="content" type="string" optional="1" default=""/>

    <fc:renderer>
        <main class="mai-page mai-page--landing">
            <f:if condition="{hero}"><div class="mai-page__hero">{hero -> f:format.raw()}</div></f:if>
            <div class="mai-page__content">{content -> f:format.raw()}</div>
        </main>
    </fc:renderer>
</fc:component>
