<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:mai="http://typo3.org/ns/Maispace/MaiAssets/ViewHelpers"
      xmlns:theme="http://typo3.org/ns/Maispace/MaiTheme/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">
<f:argument name="item" type="mixed" optional="{false}" />
<f:argument name="index" type="integer" optional="{false}" />
<f:argument name="total" type="integer" optional="{false}" />
<f:argument name="parentUid" type="integer" optional="{false}" />
<div class="mai-slider__item"
    role="group"
    aria-roledescription="slide"
    aria-label="{index} of {total}"
    id="slide-{parentUid}-{index}"
    data-index="{index}">
    <f:if condition="{item.images.0}">
        <mai:image.picture image="{item.images.0}"
                           alt="{item.data.headline}"
                           class="mai-slider__image"/>
    </f:if>
    <div class="mai-slider__body">
        <f:if condition="{item.data.headline}">
            <theme:atom.heading level="3" text="{item.data.headline}" class="mai-slider__headline"/>
        </f:if>
        <f:if condition="{item.data.bodytext}">
            <div class="mai-slider__text">{item.data.bodytext -> f:format.html()}</div>
        </f:if>
        <f:if condition="{item.data.link}">
            <theme:atom.link link="{item.data.link}" class="mai-slider__link">{item.data.headline}</theme:atom.link>
        </f:if>
    </div>
</div>
</html>
