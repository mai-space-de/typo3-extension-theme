<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:argument name="level" type="integer" optional="{true}" default="2" />
<f:argument name="text" type="string" optional="{false}" />
<f:argument name="class" type="string" optional="{true}" />
<f:switch expression="{level}">
    <f:case value="1"><h1 class="mai-heading mai-heading--1 {class}">{text -> f:format.raw()}</h1></f:case>
    <f:case value="2"><h2 class="mai-heading mai-heading--2 {class}">{text -> f:format.raw()}</h2></f:case>
    <f:case value="3"><h3 class="mai-heading mai-heading--3 {class}">{text -> f:format.raw()}</h3></f:case>
    <f:case value="4"><h4 class="mai-heading mai-heading--4 {class}">{text -> f:format.raw()}</h4></f:case>
    <f:case value="5"><h5 class="mai-heading mai-heading--5 {class}">{text -> f:format.raw()}</h5></f:case>
    <f:case value="6"><h6 class="mai-heading mai-heading--6 {class}">{text -> f:format.raw()}</h6></f:case>
    <f:defaultCase><h2 class="mai-heading mai-heading--2 {class}">{text -> f:format.raw()}</h2></f:defaultCase>
</f:switch>
</html>
