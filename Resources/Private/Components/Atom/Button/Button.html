<!--
    Atom/Button — maispace/theme
    ──────────────────────────────────────────────────────────────────────────
    A reusable button atom. Renders a <button> element styled with the .btn
    utility class from 04-atoms/_button.scss.

    Parameters:
      label    – Visible button text (used when no slot content is provided).
      type     – HTML button type attribute: "button" | "submit" | "reset".
      variant  – Style variant appended as a modifier class: "primary" |
                 "secondary" | "ghost" etc. Defaults to "primary".
      disabled – Disables the button and sets aria-disabled when true.

    Usage:
      {namespace theme=Maispace\MaiTheme\Components}
      <theme:atom.button label="Save" type="submit" variant="primary" />
      <theme:atom.button variant="secondary">Cancel</theme:atom.button>
-->
<fc:component>
    <fc:param name="label" type="string" optional="1" default="" />
    <fc:param name="type" type="string" optional="1" default="button" />
    <fc:param name="variant" type="string" optional="1" default="primary" />
    <fc:param name="disabled" type="boolean" optional="1" default="0" />

    <fc:renderer>
        <button
            type="{type}"
            class="btn btn--{variant}"
            {f:if(condition: disabled, then: 'disabled aria-disabled="true"')}
        ><fc:slot>{label}</fc:slot></button>
    </fc:renderer>
</fc:component>
