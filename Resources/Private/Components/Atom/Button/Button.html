<fc:component>
    <fc:param name="href" type="string" optional="1" default=""/>
    <fc:param name="label" type="string"/>
    <fc:param name="variant" type="string" optional="1" default="primary"/>
    <fc:param name="type" type="string" optional="1" default="button"/>

    <fc:renderer>
        <f:if condition="{href}">
            <f:then>
                <a href="{href}" class="mai-button mai-button--{variant}">{label}</a>
            </f:then>
            <f:else>
                <button type="{type}" class="mai-button mai-button--{variant}">{label}</button>
            </f:else>
        </f:if>
    </fc:renderer>
</fc:component>
