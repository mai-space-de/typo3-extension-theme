<!--
    Atom/Link — maispace/theme
    ──────────────────────────────────────────────────────────────────────────
    A reusable anchor atom with sensible defaults for external links.

    Parameters:
      href     – URL or Typolink target (required).
      label    – Link text; overridden by slot content when provided.
      target   – HTML target attribute (e.g. "_blank").
      external – When true, adds rel="noopener noreferrer" automatically.

    Usage:
      {namespace theme=Maispace\Theme\Components}
      <theme:atom.link href="https://typo3.org" label="TYPO3" external="1" />
      <theme:atom.link href="{f:uri.page(pageUid: 1)}">Home</theme:atom.link>
-->
<fc:component>
    <fc:param name="href" type="string" />
    <fc:param name="label" type="string" optional="1" default="" />
    <fc:param name="target" type="string" optional="1" default="" />
    <fc:param name="external" type="boolean" optional="1" default="0" />

    <fc:renderer>
        <a
            href="{href}"
            {f:if(condition: target, then: 'target="{target}"')}
            {f:if(condition: external, then: 'rel="noopener noreferrer"')}
        ><fc:slot>{label}</fc:slot></a>
    </fc:renderer>
</fc:component>
